name: Verify Pi5 monitoring integration

on:
  pull_request:
    branches: [main, feat/estacao-pi5-monitoramento-20261106, feat/admin-console-20261109, feat/analytics-cidade-filtros-20261109]
  push:
    branches: ['feat/**', 'feat/analytics-cidade-filtros-20261109', 'feat/mapa-regioes-riopreto-20261109']

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile agent/station_agent.py
